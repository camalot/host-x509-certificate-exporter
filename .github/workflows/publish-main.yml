name: Host-X509-Certificate-Exporter Publish
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and scan the image, but do not push, attest, merge or release'
        type: boolean
        default: true

permissions: {}
jobs:
  version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      ver_major_minor_patch: ${{ steps.semvers.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.semvers.outputs.major_minor }}
      ver_major: ${{ steps.semvers.outputs.major }}
      tag: ${{ steps.semvers.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.semvers.outputs.tag_major }}
      tag_major_minor: ${{ steps.semvers.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.semvers.outputs.tag_major_minor_patch }}

    env:
      GITHUB_TOKEN: "${{ github.token }}"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: camalot/xget-action@v1

    - shell: bash
      id: semvers
      run: |
        xget install caarlos0/svu --ignore .sbom.json --asset .tar.gz --to /usr/local/bin/svu --non-interactive

        v_current=$(/usr/local/bin/svu current)
        v_major=$(/usr/local/bin/svu major)
        v_minor=$(/usr/local/bin/svu minor)
        v_patch=$(/usr/local/bin/svu patch)

        current=${v_current#v}
        major=${v_major#v}
        minor=${v_minor#v}
        patch=${v_patch#v}
        echo "current: $current"
        echo "major: $major"
        echo "minor: $minor"
        echo "patch: $patch"
        echo "v_patch: $v_patch"
        echo "v_minor: $v_minor"
        echo "v_major: $v_major"
        echo "v_current: $v_current"

        {
          echo current=$current
          echo ver_major_minor_patch=$patch
          echo ver_major_minor=$minor
          echo ver_major=$major
          echo tag_major_minor_patch="$v_patch"
          echo tag_major_minor="$v_minor"
          echo tag_major="$v_major"
          echo tag_current="$v_current"
        } >> "$GITHUB_OUTPUT"

    # - uses: camalot/actions/version/get@v1
    #   id: semvers
  docker:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Prepare
      id: prep
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        REPOSITORY: ${{ github.repository }}
        APP_VERSION: ${{ needs.version.outputs.ver_major_minor_patch }}
      run: |
        GHCR_IMAGE="ghcr.io/${REPOSITORY}";
        DOCKER_IMAGE="${DOCKERHUB_USERNAME}/host-x509-certificate-exporter"
        {
          echo "ghcr_image=${GHCR_IMAGE}"
          echo "docker_image=${DOCKER_IMAGE}"
          echo "build_date=$(date +'%Y-%m-%dT%TZ%z' -u)"
          echo "project_name=${REPOSITORY#*/}"
          echo "tags<<EOF"
          echo "${DOCKER_IMAGE}:latest"
          echo "${DOCKER_IMAGE}:${APP_VERSION}"
          echo "${GHCR_IMAGE}:latest"
          echo "${GHCR_IMAGE}:${APP_VERSION}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      if: ${{ !inputs.dry_run }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GHCR
      if: ${{ !inputs.dry_run }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and Push
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        push: ${{ !inputs.dry_run }}
        load: ${{ inputs.dry_run }}
        provenance: ${{ inputs.dry_run && 'false' || 'mode=max' }}
        sbom: ${{ !inputs.dry_run }}
        build-args: |
          PROJECT_NAME=${{ steps.prep.outputs.project_name }}
          BUILD_VERSION=${{ needs.version.outputs.ver_major_minor_patch }}
          BUILD_REF=${{ github.ref }}
          BUILD_SHA=${{ github.sha }}
          BUILD_DATE=${{ steps.prep.outputs.build_date }}
        tags: ${{ steps.prep.outputs.tags }}

    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ inputs.dry_run && format('{0}:{1}', steps.prep.outputs.ghcr_image, needs.version.outputs.ver_major_minor_patch) || format('{0}@{1}', steps.prep.outputs.ghcr_image, steps.docker_build.outputs.digest) }}
        format: spdx-json
        output-file: sbom.spdx.json
        artifact-name: sbom.spdx.json

    - name: Attest build provenance (GHCR)
      if: ${{ !inputs.dry_run }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.prep.outputs.ghcr_image }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        push-to-registry: true

    - name: Attest build provenance (DockerHub)
      if: ${{ !inputs.dry_run }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: index.docker.io/${{ steps.prep.outputs.docker_image }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        push-to-registry: true

    - name: Attest SPDX SBOM (GHCR)
      if: ${{ !inputs.dry_run }}
      uses: actions/attest@v4
      with:
        subject-name: ${{ steps.prep.outputs.ghcr_image }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        sbom-path: sbom.spdx.json
        push-to-registry: true

    - name: Attest SPDX SBOM (DockerHub)
      if: ${{ !inputs.dry_run }}
      uses: actions/attest@v4
      with:
        subject-name: index.docker.io/${{ steps.prep.outputs.docker_image }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        sbom-path: sbom.spdx.json
        push-to-registry: true
  merge:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    needs:
    - docker
    - version
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Merge develop -> main
      uses: devmasx/merge-branch@1.4.0
      with:
        type: now
        from_branch: develop
        target_branch: main
        github_token: ${{ github.token }}
    - name: Download SPDX SBOM
      uses: actions/download-artifact@v8
      with:
        name: sbom.spdx.json
        path: sbom

    # creates the tag on main (target) and the release in one step
    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        gh release create "${TAG}" sbom/sbom.spdx.json --target main --title "${TAG}" --generate-notes
